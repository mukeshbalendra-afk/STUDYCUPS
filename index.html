<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Offer</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:linear-gradient(135deg,#892043,#c2185b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
width:320px;
}

input{
width:90%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#892043;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
}

#scratchBox{
display:none;
margin-top:15px;
}

canvas{
border-radius:10px;
}

/* hidden reward */
.reward{
display:none;
font-size:22px;
color:#892043;
font-weight:bold;
margin-top:10px;
animation:pop 0.5s ease;
}

@keyframes pop{
from{transform:scale(0.5);opacity:0;}
to{transform:scale(1);opacity:1;}
}

/* sparkle */
.sparkle{
position:relative;
height:0;
}

.sparkle span{
position:absolute;
width:6px;
height:6px;
background:gold;
border-radius:50%;
animation:fly 1s linear infinite;
}

@keyframes fly{
0%{opacity:1; transform:translateY(0);}
100%{opacity:0; transform:translateY(-60px);}
}

</style>
</head>

<body>

<div class="card">

<h3>🎯 Unlock Your Scholarship</h3>

<!-- FORM -->
<div id="formBox">
<input id="name" placeholder="Enter Name">
<input id="phone" placeholder="Enter Phone">
<button onclick="startScratch()">Continue</button>
</div>

<!-- SCRATCH AREA -->
<div id="scratchBox">
<canvas id="canvas" width="300" height="120"></canvas>

<div id="reward" class="reward">
🎉 ₹5000 SCHOLARSHIP UNLOCKED 🎉
</div>

<div id="sparkle" class="sparkle"></div>
</div>

</div>

<script>

// prevent repeat
if(localStorage.getItem("claimed")){
document.getElementById("formBox").innerHTML="⚠️ Offer already claimed";
}

// STEP 1 → SHOW SCRATCH ONLY AFTER FORM
function startScratch(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;

if(name=="" || phone==""){
alert("Please fill details");
return;
}

document.getElementById("formBox").style.display="none";
document.getElementById("scratchBox").style.display="block";

initScratch();
}

// STEP 2 → SCRATCH LOGIC
function initScratch(){

var canvas=document.getElementById("canvas");
var ctx=canvas.getContext("2d");

ctx.fillStyle="#C0C0C0";
ctx.fillRect(0,0,300,120);

let revealed=false;

function scratch(x,y){

var rect=canvas.getBoundingClientRect();
x=x-rect.left;
y=y-rect.top;

ctx.globalCompositeOperation="destination-out";
ctx.beginPath();
ctx.arc(x,y,20,0,Math.PI*2);
ctx.fill();

// STEP 3 → SHOW REWARD ONLY AFTER SCRATCH
if(!revealed){
revealed=true;

document.getElementById("reward").style.display="block";

// sparkle
let sp=document.getElementById("sparkle");
for(let i=0;i<30;i++){
let s=document.createElement("span");
s.style.left=Math.random()*100+"%";
s.style.top="50px";
sp.appendChild(s);
}

// mark claimed
localStorage.setItem("claimed",true);

}
}

// mouse
canvas.addEventListener("mousemove",e=>{
if(e.buttons==1) scratch(e.clientX,e.clientY);
});

// touch
canvas.addEventListener("touchmove",e=>{
scratch(e.touches[0].clientX,e.touches[0].clientY);
e.preventDefault();
});

}

</script>

</body>
</html>
