<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Offer</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:linear-gradient(135deg,#892043,#c2185b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
width:320px;
}

input{
width:90%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
background:#892043;
color:white;
border:none;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
}

canvas{
margin-top:10px;
border-radius:10px;
}

.reward{
display:none;
font-size:20px;
color:#892043;
font-weight:bold;
}

.sparkle span{
position:absolute;
width:5px;
height:5px;
background:gold;
border-radius:50%;
animation:up 1s infinite;
}

@keyframes up{
0%{opacity:1; transform:translateY(0);}
100%{opacity:0; transform:translateY(-50px);}
}
</style>
</head>

<body>

<div class="card">

<h3>🎯 Scratch & Win ₹5000</h3>

<div id="formBox">
<input id="name" placeholder="Enter Name">
<input id="phone" placeholder="Enter Phone">
<button onclick="submitData()">Unlock Offer</button>
</div>

<div id="scratchBox" style="display:none;">
<canvas id="canvas" width="300" height="120"></canvas>
<div id="reward" class="reward">🎉 ₹5000 WON 🎉</div>
<div id="sparkle"></div>
</div>

</div>

<script>

// 🔥 PASTE YOUR GOOGLE SCRIPT URL HERE
var API_URL = "PASTE_YOUR_WEB_APP_URL";

// prevent repeat
if(localStorage.getItem("claimed")){
document.getElementById("formBox").innerHTML="⚠️ Offer already claimed";
}

function submitData(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;

if(name==""||phone==""){
alert("Fill details");
return;
}

fetch(API_URL,{
method:"POST",
body:JSON.stringify({name,phone})
})
.then(res=>res.text())
.then(res=>{

if(res=="EXISTS"){
alert("Already claimed!");
return;
}

document.getElementById("formBox").style.display="none";
document.getElementById("scratchBox").style.display="block";
initScratch();

});

}

function initScratch(){

var canvas=document.getElementById("canvas");
var ctx=canvas.getContext("2d");

ctx.fillStyle="#C0C0C0";
ctx.fillRect(0,0,300,120);

let done=false;

function scratch(x,y){

var rect=canvas.getBoundingClientRect();
x=x-rect.left;
y=y-rect.top;

ctx.globalCompositeOperation="destination-out";
ctx.beginPath();
ctx.arc(x,y,20,0,Math.PI*2);
ctx.fill();

if(!done){
done=true;

document.getElementById("reward").style.display="block";

let sp=document.getElementById("sparkle");

for(let i=0;i<30;i++){
let s=document.createElement("span");
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
sp.appendChild(s);
}

// mark claimed
localStorage.setItem("claimed",true);

// 🔥 WhatsApp redirect
setTimeout(()=>{
window.location.href="https://wa.me/91XXXXXXXXXX?text=I%20won%205000%20offer";
},2000);

}

}

canvas.addEventListener("mousemove",e=>{
if(e.buttons==1) scratch(e.clientX,e.clientY);
});

canvas.addEventListener("touchmove",e=>{
scratch(e.touches[0].clientX,e.touches[0].clientY);
e.preventDefault();
});

}

</script>

</body>
</html>
