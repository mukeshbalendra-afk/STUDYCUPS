<!DOCTYPE html>
<html>
<head>
  <title>Scratch & Win</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin:0;font-family:sans-serif;background:linear-gradient(135deg,#892043,#c2185b);display:flex;justify-content:center;align-items:center;height:100vh;">

<div style="max-width:380px;width:100%;text-align:center;border-radius:15px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,0.3);background:white;">

  <!-- TOP -->
  <div style="background:#892043;color:white;padding:15px;">
    <h2 style="margin:0;font-size:18px;">ADVANCE BANKER PROGRAM</h2>
  </div>

  <!-- BODY -->
  <div style="padding:20px;">
    
    <p style="color:#892043;font-weight:bold;font-size:18px;">
      🎯 Scratch & Unlock Your Career Benefit
    </p>

    <!-- SCRATCH -->
    <div style="position:relative;display:inline-block;">
      
      <!-- HIDDEN TEXT -->
      <div style="
        width:300px;
        height:120px;
        background:white;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        border-radius:10px;
        position:absolute;
        top:0;
        left:0;
      ">
        <div style="color:#892043;font-size:18px;font-weight:bold;">
          🎉 50% Scholarship Unlocked 🎉
        </div>
        <div style="font-size:14px;margin-top:5px;">
          LIMITED OFFER
        </div>
        <div style="font-size:14px;font-weight:bold;">
          Valid only for 24 hours ⏳
        </div>
      </div>

      <!-- CANVAS -->
      <canvas id="scratchCard" width="300" height="120"
        style="border-radius:10px;"></canvas>

    </div>

    <p id="msg" style="margin-top:15px;color:green;font-weight:bold;"></p>

    <!-- BUTTON -->
    <button onclick="claimNow()" style="
      margin-top:10px;
      padding:10px 20px;
      border:none;
      background:#892043;
      color:white;
      border-radius:25px;
      cursor:pointer;
    ">
      Claim Now
    </button>

  </div>

  <!-- FOOTER -->
  <div style="background:#892043;color:white;padding:10px;">
    Limited Seats Available
  </div>

</div>

<script>
var canvas = document.getElementById("scratchCard");
var ctx = canvas.getContext("2d");

// already used check
if(localStorage.getItem("used")){
  canvas.style.display="none";
  document.getElementById("msg").innerText="⚠️ You already unlocked this offer!";
}

// silver layer
ctx.fillStyle = "#C0C0C0";
ctx.fillRect(0, 0, canvas.width, canvas.height);

function scratch(x, y) {
  var rect = canvas.getBoundingClientRect();
  x = x - rect.left;
  y = y - rect.top;

  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();
  ctx.arc(x, y, 20, 0, 2 * Math.PI);
  ctx.fill();

  localStorage.setItem("used", true);
  document.getElementById("msg").innerText="🎉 Offer Unlocked!";
}

// mouse
canvas.addEventListener("mousemove", function(e) {
  if (e.buttons === 1) scratch(e.clientX, e.clientY);
});

// touch
canvas.addEventListener("touchmove", function(e) {
  var touch = e.touches[0];
  scratch(touch.clientX, touch.clientY);
  e.preventDefault();
});

// CTA
function claimNow(){
  window.location.href = "https://wa.me/91XXXXXXXXXX?text=I want to claim my scholarship";
}
</script>

</body>
</html>
