<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch & Win</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:linear-gradient(135deg,#892043,#c2185b);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:20px;
border-radius:15px;
text-align:center;
width:320px;
}

h2{
margin:0;
color:#892043;
}

h3{
color:#892043;
margin-top:5px;
}

/* scratch box */
.scratchBox{
position:relative;
margin-top:10px;
}

/* 👇 reward behind canvas */
.reward{
position:absolute;
top:40%;
left:50%;
transform:translate(-50%,-50%);
font-size:22px;
color:#892043;
font-weight:bold;
pointer-events:none;
}

/* canvas on top */
canvas{
border-radius:10px;
position:relative;
z-index:2;
}

/* sparkle */
.sparkle{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

.sparkle span{
position:absolute;
width:6px;
height:6px;
background:gold;
border-radius:50%;
animation:fly 1s linear infinite;
}

@keyframes fly{
0%{opacity:1; transform:translateY(0);}
100%{opacity:0; transform:translateY(-60px);}
}

</style>
</head>

<body>

<div class="card">

<!-- 👇 ADDED BRAND NAME -->
<h2>Ralph Ryker Learning</h2>

<h3>🎯 Scratch & Win Reward</h3>

<div id="scratchBox" class="scratchBox">

<!-- 👇 reward now behind -->
<div id="reward" class="reward">
🎉 ₹5000 WON 🎉
</div>

<canvas id="canvas" width="300" height="120"></canvas>

<div id="sparkle" class="sparkle"></div>

</div>

<p id="msg" style="color:red;font-weight:bold;"></p>

</div>

<script>

var canvas=document.getElementById("canvas");
var ctx=canvas.getContext("2d");

// already used check
if(localStorage.getItem("claimed")){
canvas.style.display="none";
document.getElementById("msg").innerText="⚠️ You already claimed this offer";
}

// silver layer
ctx.fillStyle="#C0C0C0";
ctx.fillRect(0,0,300,120);

let revealed=false;

function scratch(x,y){

var rect=canvas.getBoundingClientRect();
x=x-rect.left;
y=y-rect.top;

ctx.globalCompositeOperation="destination-out";
ctx.beginPath();
ctx.arc(x,y,20,0,Math.PI*2);
ctx.fill();

if(!revealed){
revealed=true;

// sparkle
let sp=document.getElementById("sparkle");
for(let i=0;i<30;i++){
let s=document.createElement("span");
s.style.left=Math.random()*100+"%";
s.style.top="50px";
sp.appendChild(s);
}

// mark claimed
localStorage.setItem("claimed",true);
}
}

// mouse
canvas.addEventListener("mousemove",e=>{
if(e.buttons==1) scratch(e.clientX,e.clientY);
});

// touch
canvas.addEventListener("touchmove",e=>{
scratch(e.touches[0].clientX,e.touches[0].clientY);
e.preventDefault();
});

</script>

</body>
</html>
